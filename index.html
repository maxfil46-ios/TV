<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#10131b"><link rel="manifest" href="/manifest.json"><title>Пульт ТВ</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#10131b;color:#f5f6fa;font:17px -apple-system,BlinkMacSystemFont,sans-serif;min-height:100dvh;display:flex;justify-content:center}.wrap{width:min(100%,430px);padding:24px 22px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 20px}.title{font-size:21px;font-weight:700}.status{font-size:12px;color:#9ba5b8}.pair{display:flex;gap:8px;margin-bottom:20px}.pair input{width:100px;background:#202634;border:1px solid #374153;border-radius:12px;color:white;font-size:18px;text-align:center;padding:12px}.btn{border:0;background:#252c3a;color:#f7f8fb;border-radius:18px;font-size:18px;font-weight:600;min-height:58px;box-shadow:0 3px 0 #171c26;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:none;background:#38445a}.pair .btn{min-height:48px;padding:0 16px;border-radius:12px;font-size:15px}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 25px}.apps .btn{min-height:48px;border-radius:14px;font-size:13px}.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:62px 76px 62px;gap:10px;max-width:300px;margin:0 auto 22px}.pad .btn{border-radius:22px}.up{grid-column:2}.left{grid-column:1;grid-row:2}.ok{grid-column:2;grid-row:2;border-radius:50%!important;background:#38445a}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.row .btn{min-height:52px;font-size:15px}.vol{display:flex;gap:10px}.vol .btn{flex:1}.hint{height:30px;text-align:center;color:#a9efc2;font-size:13px;padding-top:8px}
</style></head><body><main class="wrap"><header class="top"><div class="title">Пульт ТВ</div><div id="status" class="status">Не подключён</div></header><section class="pair"><input id="pin" inputmode="numeric" maxlength="6" placeholder="PIN"><button class="btn" onclick="pair()">Подключить</button></section><div class="apps"><button class="btn" onclick="app('youtube')">YouTube</button><button class="btn" onclick="app('vk')">VK Видео</button><button class="btn" onclick="app('kinopoisk')">Кинопоиск</button><button class="btn" onclick="app('happ')">Happ</button></div><section class="pad"><button class="btn up" onclick="key('up')">▲</button><button class="btn left" onclick="key('left')">◀</button><button class="btn ok" onclick="key('ok')">ОК</button><button class="btn right" onclick="key('right')">▶</button><button class="btn down" onclick="key('down')">▼</button></section><div class="row"><button class="btn" onclick="key('back')">Назад</button><button class="btn" onclick="key('home')">Домой</button><button class="btn" onclick="key('playpause')">⏯</button></div><div class="vol"><button class="btn" onclick="key('volumedown')">− Громкость</button><button class="btn" onclick="key('mute')">Без звука</button><button class="btn" onclick="key('volumeup')">Громкость +</button></div><div class="row" style="margin-top:14px"><button class="btn" style="grid-column:2" onclick="key('assistant')">Алиса</button></div><div class="hint" id="hint"></div></main><script>
let token=localStorage.getItem('tv-token')||'';const statusEl=document.getElementById('status');if(token)statusEl.textContent='Сопряжён';async function pair(){try{let r=await fetch('/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:document.getElementById('pin').value})});let x=await r.json();if(!r.ok)throw Error(x.error);token=x.token;localStorage.setItem('tv-token',token);statusEl.textContent='Сопряжён';msg('Пульт подключён')}catch(e){msg(e.message)}}async function send(path,obj){if(!token)return msg('Сначала подключитесь по PIN');try{let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Remote-Token':token},body:JSON.stringify(obj)});let x=await r.json();if(!r.ok)throw Error(x.error);msg('')}catch(e){msg(e.message);if(e.message.includes('PIN')){token='';localStorage.removeItem('tv-token');statusEl.textContent='Не подключён'}}}function key(k){send('/key',{key:k})}function app(a){send('/app',{app:a})}function msg(t){document.getElementById('hint').textContent=t}if('serviceWorker'in navigator){} 
</script></body></html>
